name: ARC smoke test

on:
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  smoketest:
    runs-on: arc-runner-set
    steps:
      - run: |
          echo "Runner: $RUNNER_NAME"
          uname -a

      - run: |
          ls -la /etc/buildkit/tls
          test -r /etc/buildkit/tls/ca.crt
          test -r /etc/buildkit/tls/tls.crt
          test -r /etc/buildkit/tls/tls.key

      - run: docker info

